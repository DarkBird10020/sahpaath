# Every push and every pull request runs the same checks we run locally, so a
# change that breaks the landing page, the navigation or the trust model is
# caught on GitHub instead of on someone's laptop an hour later.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit and the production bundle.
      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      # The browser tests cover the navigation, the scroll sections and the
      # accessibility scans. They never call an AI provider: the Playwright
      # config blanks GEMINI_API_KEY, so no secrets are needed here.
      - name: Browser tests
        run: npx playwright test

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
